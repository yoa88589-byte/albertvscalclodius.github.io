<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#050510">
<meta name="description" content="Website pribadi Albert Clodius Vascal, mahasiswa asal Sampit.">
<title>Galeri | Albert Clodius Vascal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;700&family=Space+Grotesk:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#050510;--surface:rgba(255,255,255,.03);--border:rgba(255,255,255,.08);--text:#eef0ff;--muted:#9a9cc0;--teal:#4fd8c4;--purple:#8b7bff;--r:16px}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;flex-direction:column;background:var(--bg);color:var(--text);font-family:'Inter',system-ui,sans-serif;line-height:1.65;-webkit-font-smoothing:antialiased}
main{flex:1}
a{color:var(--teal);text-decoration:none}
a:hover{text-decoration:underline}
img{display:block;max-width:100%}
.wrap{width:min(1140px,calc(100% - 48px));margin:0 auto}
.top{position:sticky;top:0;z-index:50;background:rgba(5,5,16,.88);backdrop-filter:blur(10px);border-bottom:1px solid var(--border)}
.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:20px;padding:16px 0;flex-wrap:wrap}
.logo{font-family:'JetBrains Mono',monospace;font-weight:700;font-size:1rem;color:var(--teal)}
.logo:hover{opacity:.85;text-decoration:none}
nav ul{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;align-items:center;gap:8px}
nav a{display:inline-block;padding:7px 15px;border-radius:999px;font-size:.9rem;font-weight:500;color:var(--muted);border:1px solid transparent;transition:.2s}
nav a:hover{color:var(--text);background:rgba(255,255,255,.06);text-decoration:none}
nav a.active{color:#fff;background:rgba(139,123,255,.14);border-color:var(--purple)}
.page{padding:52px 0 68px}
h1{font-family:'Space Grotesk',sans-serif;line-height:1.2;margin-top:0;font-size:clamp(1.9rem,3.8vw,2.8rem);margin-bottom:8px;background:linear-gradient(90deg,#fff 40%,#a79bff 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.lead{margin:0 0 32px;color:var(--muted)}
.galeri{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:18px}
.galeri figure{margin:0;background:var(--surface);border:1px solid var(--border);border-radius:var(--r);overflow:hidden;transition:.2s}
.galeri figure:hover{border-color:rgba(139,123,255,.55);transform:translateY(-2px)}
.galeri img,.img-err{width:100%;aspect-ratio:4/3;object-fit:cover;object-position:center 30%;background:#0a0a18}
.img-err{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:16px;font-size:.85rem;color:#fca5a5;border-bottom:1px solid var(--border)}
.img-err code{margin-top:6px;color:var(--teal);font-family:'JetBrains Mono',monospace;font-size:.8rem}
.galeri figcaption{padding:12px 16px;font-size:.9rem;color:var(--muted)}
.bawah{border-top:1px solid var(--border);padding:22px 0;font-size:.875rem;color:var(--muted)}
</style>
<script>
function cobaExt(img) {
  const exts = ['.jpeg', '.JPG', '.JPEG', '.png'];
  const i = Number(img.dataset.i || 0);
  if (i < exts.length) {
    img.dataset.i = i + 1;
    img.src = img.dataset.base + exts[i];
  } else {
    const d = document.createElement('div');
    d.className = 'img-err';
    d.innerHTML = 'Foto belum ketemu di GitHub:<code>' + img.dataset.base + '.jpg / .jpeg</code>';
    img.replaceWith(d);
  }
}
</script>
</head>
<body>
<header class="top">
  <div class="wrap">
    <a class="logo" href="index.html">albert.vascal</a>
    <nav aria-label="Menu utama">
      <ul>
        <li><a href="index.html">Beranda</a></li>
        <li><a href="biodata.html">Biodata</a></li>
        <li><a href="galeri.html" class="active" aria-current="page">Galeri</a></li>
        <li><a href="video.html">Video</a></li>
        <li><a href="tugas1.html">Tugas 1</a></li>
        <li><a href="tugas2.html">Tugas 2</a></li>
        <li><a href="tugas3.html">Tugas 3</a></li>
        <li><a href="tugas-akhir.html">Tugas Akhir</a></li>
      </ul>
    </nav>
  </div>
</header>
<main class="page">
  <div class="wrap">
    <h1>Galeri</h1>
    <p class="lead">Dokumentasi kegiatan dan momen yang saya simpan.</p>
    <div class="galeri">
      <figure class="f1"><img src="foto/foto1.jpg" data-base="foto/foto1" alt="Layar Zoom pelatihan kaji cepat bencana" loading="lazy" onerror="cobaExt(this)"><figcaption>Pelatihan Kaji Cepat Bencana via Zoom, Juli 2022</figcaption></figure>
      <figure class="f2"><img src="foto/foto2.jpg" data-base="foto/foto2" alt="Potret diri Albert di dalam ruangan" loading="lazy" onerror="cobaExt(this)"><figcaption>Momen santai di kafe</figcaption></figure>
      <figure class="f3"><img src="foto/foto3.jpg" data-base="foto/foto3" alt="Tampak depan keseluruhan Sulthan Kost" loading="lazy" onerror="cobaExt(this)"><figcaption>Tampak depan area Sulthan Kost</figcaption></figure>
      <figure class="f4"><img src="foto/foto4.jpg" data-base="foto/foto4" alt="Gerbang masuk dan kamar Sulthan Kost" loading="lazy" onerror="cobaExt(this)"><figcaption>Gerbang masuk dan deretan kamar Sulthan Kost</figcaption></figure>
      <figure class="f5"><img src="foto/foto5.jpg" data-base="foto/foto5" alt="Sudut bangunan samping Sulthan Kost" loading="lazy" onerror="cobaExt(this)"><figcaption>Tampak sudut bangunan Sulthan Kost</figcaption></figure>
    </div>
  </div>
</main>
<footer class="bawah">
  <div class="wrap">&copy; 2026 Albert Clodius Vascal. Dibuat dengan HTML &amp; CSS.</div>
</footer>
</body>
</html>
